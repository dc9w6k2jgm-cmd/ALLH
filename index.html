<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Lalla Hiba ❤️</title>

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff9ec4,#ffd6e7);
font-family:Arial,sans-serif;
overflow:hidden;
}

.card{
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);
width:320px;
position:relative;
}

h1{
color:#ff2f74;
font-size:32px;
}

p{
font-size:22px;
margin-bottom:30px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:40px;
cursor:pointer;
transition:.2s;
}

#yes{
background:#ff2f74;
color:white;
margin-right:15px;
}

#no{
background:#ddd;
position:absolute;
}

#result{
display:none;
font-size:38px;
color:#ff2f74;
font-weight:bold;
animation:pop .6s;
}

@keyframes pop{
0%{transform:scale(.2);}
100%{transform:scale(1);}
}
</style>

</head>
<body>

<div class="card" id="question">

<h1>❤️</h1>

<p><b>Lalla hiba do u love me 🥹</b></p>

<button id="yes">YES ❤️</button>
<button id="no">NO</button>

</div>

<div id="result">

<h1>🥹❤️</h1>

<h2>Sff ana frhan ❤️</h2>

</div>

<script>

const no=document.getElementById("no");

no.addEventListener("mouseover",move);

no.addEventListener("touchstart",move);

function move(){

let x=Math.random()*(window.innerWidth-120);

let y=Math.random()*(window.innerHeight-60);

no.style.left=x+"px";

no.style.top=y+"px";

}

document.getElementById("yes").onclick=function(){

document.getElementById("question").style.display="none";

document.getElementById("result").style.display="block";

}

</script>

</body>
</html>
